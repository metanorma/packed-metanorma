name: build

# Tebako v2 assembly for packed-metanorma. One pipeline: fetch (sha256-pinned
# tebako toolchain + payload slices) → assemble (tebako-pkg bundle) →
# validate (structural gates + smoke + PDF compile) → publish (release +
# downstream dispatches) → installer containers (spec 16 §7: the macOS pkg
# legs build + install-rehearse on every run and ship signed+notarized on
# armed tags; the MSI leg parks with the windows press leg). Replaces the
# six retired v1 workflows. Inputs live in versions.yaml (SSOT); the
# package manifest template lives in package/package-manifest.yaml.
#
# Both former upstream blockers are FIXED by the pins in versions.yaml:
#  - the region-mounts gap (TEBAKO_TFS_MOUNTS bare `image:mount` pairs
#    → EINVAL on spawned children): fixed in tebako v0.2.7+ (the #458
#    composition work; slots mount as offset/length regions) — pinned
#    toolchain v0.3.1 carries it;
#  - the windows runtime asset-naming mismatch (exit 75 pre-era) and the
#    LoadError-126-on-ox.so gap: fixed in tebako-runtime-ruby v0.16.10+
#    (naming + the library_aliases support-DLL payload, #133) — pinned
#    runtime v0.16.11 carries both.
# The smoke + PDF legs are ENFORCED (no continue-on-error, no known-signature
# accommodations); any failure is a real regression.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      payload_version:
        description: 'metanorma payload version to pin (e.g. 1.17.0)'
        required: true
        type: string
  repository_dispatch:
    types: [tebako-packages/metanorma]

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  press:
    name: press (${{ matrix.triplet }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # WINDOWS LEG PARKED (spec 32): versions.yaml's xml2rfc entry has no
      # x86_64-windows-ucrt asset — no windows xml2rfc payload (the
      # feedstock is POSIX-only today) and no windows python runtime (the
      # factory's first published line built six POSIX legs) exist.
      # tools/pins.rb would fail a windows "Read pins" step CLOSED (a
      # missing asset is a named error, never a silent skip of the spawn
      # edge), and a permanently-red leg blocks the release job
      # (needs: [press]) — so the leg is out of the matrix until the
      # xml2rfc feedstock ships its windows build. The release layout,
      # notes, asset list, and the chocolatey/winget downstream dispatches
      # park with it (see the release job).
      matrix:
        include:
          - triplet: aarch64-macos
            os: macos-14
            tool: macos-arm64
            legacy: metanorma-darwin-arm64
          - triplet: x86_64-linux-gnu
            os: ubuntu-24.04
            tool: linux-gnu-x86_64
            legacy: metanorma-linux-x86_64
          # - triplet: x86_64-windows-ucrt   # PARKED — see above
          #   os: windows-latest
          #   tool: windows-ucrt64
          #   legacy: metanorma-windows-x86_64.exe
    env:
      LEGACY: ${{ matrix.legacy }}
    steps:
      - uses: actions/checkout@v4

      # setup-msys2 must precede every `shell: msys2 {0}` step (the shell
      # wrapper is only on PATH once this action has run).
      - name: Setup msys2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            tar
            curl
            git
            ruby
            zip

      - name: Read pins (POSIX)
        if: runner.os != 'Windows'
        # Also anchors every scratch dir at $RUNNER_TEMP (the `runner`
        # context is not legal in workflow/job env, so these flow via
        # $GITHUB_ENV from here). TEBAKO_HOME is the runtime cache the
        # smoke/compile runs download into.
        run: |
          ruby tools/pins.rb "${{ matrix.triplet }}" "${{ matrix.tool }}" --env >> "$GITHUB_ENV"
          {
            echo "TEBAKO_HOME=$RUNNER_TEMP/tebako-home"
            echo "TEBAKO_TOOLS=$RUNNER_TEMP/tebako-tools"
            echo "TEBAKO_BOOT=$RUNNER_TEMP/tebako-boot"
            echo "PAYLOADS=$RUNNER_TEMP/payloads"
          } >> "$GITHUB_ENV"

      - name: Read pins (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # cygpath -m: native binaries (the package, tebako-pkg.exe) need
        # win32 spellings; each later msys2 step re-normalizes with
        # cygpath -u for its own shell use.
        run: |
          ruby tools/pins.rb "${{ matrix.triplet }}" "${{ matrix.tool }}" --env >> "$GITHUB_ENV"
          tmp=$(cygpath -m "$RUNNER_TEMP")
          {
            echo "TEBAKO_HOME=$tmp/tebako-home"
            echo "TEBAKO_TOOLS=$tmp/tebako-tools"
            echo "TEBAKO_BOOT=$tmp/tebako-boot"
            echo "PAYLOADS=$tmp/payloads"
          } >> "$GITHUB_ENV"

      - name: Fetch tebako toolchain (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p "$TEBAKO_TOOLS" "$TEBAKO_BOOT"
          base="https://github.com/tamatebako/tebako/releases/download/v${TEBAKO_VERSION}"
          curl -fSL "$base/$TEBAKO_PKG_ASSET"      -o "$TEBAKO_TOOLS/tebako-pkg"
          curl -fSL "$base/$TFS_ASSET"             -o "$TEBAKO_TOOLS/tfs"
          curl -fSL "$base/$TEBAKO_BOOTSTRAP_ASSET" -o "$TEBAKO_BOOT/tebako-bootstrap"
          curl -fSL "$base/SHA256SUMS"             -o "$RUNNER_TEMP/tebako-SHA256SUMS"
          chmod +x "$TEBAKO_TOOLS/tebako-pkg" "$TEBAKO_TOOLS/tfs" "$TEBAKO_BOOT/tebako-bootstrap"
          cd "$RUNNER_TEMP"
          {
            echo "$TEBAKO_PKG_SHA256  $TEBAKO_TOOLS/tebako-pkg"
            echo "$TFS_SHA256  $TEBAKO_TOOLS/tfs"
            echo "$TEBAKO_BOOTSTRAP_SHA256  $TEBAKO_BOOT/tebako-bootstrap"
          } > local-sums.txt
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c local-sums.txt
          else
            shasum -a 256 -c local-sums.txt
          fi
          # Cross-check our pins against the release's own SHA256SUMS
          for pair in "$TEBAKO_PKG_ASSET:$TEBAKO_PKG_SHA256" "$TFS_ASSET:$TFS_SHA256" "$TEBAKO_BOOTSTRAP_ASSET:$TEBAKO_BOOTSTRAP_SHA256"; do
            asset="${pair%%:*}"; want="${pair##*:}"
            got=$(awk -v a="$asset" '$2 == a {print $1}' tebako-SHA256SUMS | tr 'A-F' 'a-f')
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: versions.yaml=$want release=$got"; exit 1; }
          done
          echo "toolchain OK"

      - name: Fetch tebako toolchain (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TEBAKO_TOOLS=$(cygpath -u "$TEBAKO_TOOLS")
          TEBAKO_BOOT=$(cygpath -u "$TEBAKO_BOOT")
          RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p "$TEBAKO_TOOLS" "$TEBAKO_BOOT"
          base="https://github.com/tamatebako/tebako/releases/download/v${TEBAKO_VERSION}"
          curl -fSL "$base/$TEBAKO_PKG_ASSET"      -o "$TEBAKO_TOOLS/tebako-pkg.exe"
          curl -fSL "$base/$TFS_ASSET"             -o "$TEBAKO_TOOLS/tfs.exe"
          curl -fSL "$base/$TEBAKO_BOOTSTRAP_ASSET" -o "$TEBAKO_BOOT/tebako-bootstrap.exe"
          curl -fSL "$base/SHA256SUMS"             -o "$RUNNER_TEMP/tebako-SHA256SUMS"
          cd "$RUNNER_TEMP"
          {
            echo "$TEBAKO_PKG_SHA256 *$TEBAKO_TOOLS/tebako-pkg.exe"
            echo "$TFS_SHA256 *$TEBAKO_TOOLS/tfs.exe"
            echo "$TEBAKO_BOOTSTRAP_SHA256 *$TEBAKO_BOOT/tebako-bootstrap.exe"
          } > local-sums.txt
          sha256sum -c local-sums.txt
          for pair in "$TEBAKO_PKG_ASSET:$TEBAKO_PKG_SHA256" "$TFS_ASSET:$TFS_SHA256" "$TEBAKO_BOOTSTRAP_ASSET:$TEBAKO_BOOTSTRAP_SHA256"; do
            asset="${pair%%:*}"; want="${pair##*:}"
            got=$(awk -v a="$asset" '$2 == a {print $1}' tebako-SHA256SUMS | tr 'A-F' 'a-f')
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: versions.yaml=$want release=$got"; exit 1; }
          done
          echo "toolchain OK"

      - name: Fetch payload slices (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p "$PAYLOADS"
          mnb="https://github.com/tebako-packages/metanorma/releases/download/$MN_RELEASE"
          jdb="https://github.com/tebako-packages/openjdk/releases/download/$JDK_RELEASE"
          ikb="https://github.com/tebako-packages/inkscape/releases/download/$INK_RELEASE"
          # spec 32's spawned payload set: the xml2rfc provider image from
          # its feedstock, plus the nested python runtime pair from the
          # runtime factory (the same releases-consumed-downward rule as
          # every input — versions.yaml's xml2rfc entry carries the tags;
          # both ride PUBLISHED releases: xml2rfc 3.34.0, python v0.1.0).
          x2b="https://github.com/tebako-packages/xml2rfc/releases/download/$X2RFC_RELEASE"
          pyb="https://github.com/tamatebako/tebako-runtime-python/releases/download/$PY_RELEASE"
          curl -fSL "$mnb/$MN_FILE"  -o "$PAYLOADS/$MN_FILE"
          curl -fSL "$jdb/$JDK_FILE" -o "$PAYLOADS/$JDK_FILE"
          curl -fSL "$jdb/$JDK_EXE_FILE" -o "$PAYLOADS/$JDK_EXE_FILE"
          curl -fSL "$ikb/$INK_FILE" -o "$PAYLOADS/$INK_FILE"
          curl -fSL "$x2b/$X2RFC_FILE" -o "$PAYLOADS/$X2RFC_FILE"
          curl -fSL "$pyb/$PY_EXE_FILE" -o "$PAYLOADS/$PY_EXE_FILE"
          curl -fSL "$pyb/$PY_IMAGE_FILE" -o "$PAYLOADS/$PY_IMAGE_FILE"
          chmod +x "$PAYLOADS/$PY_EXE_FILE"
          cd "$PAYLOADS"
          {
            echo "$MN_SHA256  $MN_FILE"
            echo "$JDK_SHA256  $JDK_FILE"
            echo "$JDK_EXE_SHA256  $JDK_EXE_FILE"
            echo "$INK_SHA256  $INK_FILE"
            echo "$X2RFC_SHA256  $X2RFC_FILE"
            echo "$PY_EXE_SHA256  $PY_EXE_FILE"
            echo "$PY_IMAGE_SHA256  $PY_IMAGE_FILE"
          } > sums.txt
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c sums.txt; else shasum -a 256 -c sums.txt; fi
          ls -l

      - name: Fetch payload slices (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          PAYLOADS=$(cygpath -u "$PAYLOADS")
          mkdir -p "$PAYLOADS"
          mnb="https://github.com/tebako-packages/metanorma/releases/download/$MN_RELEASE"
          jdb="https://github.com/tebako-packages/openjdk/releases/download/$JDK_RELEASE"
          ikb="https://github.com/tebako-packages/inkscape/releases/download/$INK_RELEASE"
          curl -fSL "$mnb/$MN_FILE"  -o "$PAYLOADS/$MN_FILE"
          curl -fSL "$jdb/$JDK_FILE" -o "$PAYLOADS/$JDK_FILE"
          curl -fSL "$jdb/$JDK_EXE_FILE" -o "$PAYLOADS/$JDK_EXE_FILE"
          curl -fSL "$ikb/$INK_FILE" -o "$PAYLOADS/$INK_FILE"
          cd "$PAYLOADS"
          {
            echo "$MN_SHA256 *$MN_FILE"
            echo "$JDK_SHA256 *$JDK_FILE"
            echo "$JDK_EXE_SHA256 *$JDK_EXE_FILE"
            echo "$INK_SHA256 *$INK_FILE"
          } > sums.txt
          sha256sum -c sums.txt
          ls -l

      - name: Render package manifest (POSIX)
        if: runner.os != 'Windows'
        run: sh tools/render-manifest "$RUNTIME_ROOT" "$RUNTIME_REF" "$PKG_VERSION" "$RUNNER_TEMP/pkg.yaml"

      - name: Render package manifest (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP")
          sh tools/render-manifest "$RUNTIME_ROOT" "$RUNTIME_REF" "$PKG_VERSION" "$RUNNER_TEMP/pkg.yaml"

      - name: Assemble package (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist
          "$TEBAKO_TOOLS/tebako-pkg" bundle \
            --bootstrap "$TEBAKO_BOOT/tebako-bootstrap" \
            --exact-mounts \
            --image "$PAYLOADS/$MN_FILE:/__tfs__" \
            --image "$PAYLOADS/$JDK_EXE_FILE" \
            --image "$PAYLOADS/$JDK_FILE" \
            --image "$PAYLOADS/$INK_FILE:/opt/inkscape" \
            --image "$PAYLOADS/$X2RFC_FILE" \
            --image "$PAYLOADS/$PY_EXE_FILE" \
            --image "$PAYLOADS/$PY_IMAGE_FILE" \
            --runtime-ref "$RUNTIME_REF" \
            --package-manifest "$RUNNER_TEMP/pkg.yaml" \
            --launcher-abi "$LAUNCHER_ABI" \
            --lean \
            -o "dist/$LEGACY"
          chmod +x "dist/$LEGACY"
          ls -l dist

      - name: Assemble package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # Two msys2 hazards, both handled:
        #  - relative spellings for every host path (msys2 mangles absolute
        #    paths in argv passed to native binaries like tebako-pkg.exe);
        #  - MSYS2_ARG_CONV_EXCL='*' so the `--image <file>:/<mount>` args
        #    survive verbatim (their colon makes msys2 treat them as path
        #    LISTS and rewrite the in-image mount onto the host drive).
        run: |
          set -euo pipefail
          TEBAKO_TOOLS=$(cygpath -u "$TEBAKO_TOOLS")
          TEBAKO_BOOT=$(cygpath -u "$TEBAKO_BOOT")
          PAYLOADS=$(cygpath -u "$PAYLOADS")
          RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP")
          mkdir -p dist
          rel_payloads=$(realpath --relative-to=. "$PAYLOADS")
          rel_boot=$(realpath --relative-to=. "$TEBAKO_BOOT")
          rel_tmp=$(realpath --relative-to=. "$RUNNER_TEMP")
          MSYS2_ARG_CONV_EXCL='*' "$TEBAKO_TOOLS/tebako-pkg.exe" bundle \
            --bootstrap "$rel_boot/tebako-bootstrap.exe" \
            --exact-mounts \
            --image "$rel_payloads/$MN_FILE:/__tfs__" \
            --image "$rel_payloads/$JDK_EXE_FILE" \
            --image "$rel_payloads/$JDK_FILE" \
            --image "$rel_payloads/$INK_FILE:/opt/inkscape" \
            --runtime-ref "$RUNTIME_REF" \
            --package-manifest "$rel_tmp/pkg.yaml" \
            --launcher-abi "$LAUNCHER_ABI" \
            --lean \
            -o "dist/$LEGACY"
          ls -l dist

      - name: Structural gates (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          pkg="dist/$LEGACY"
          "$TEBAKO_TOOLS/tebako-pkg" info --json "$pkg" > "$RUNNER_TEMP/info.json"
          ruby - "$RUNNER_TEMP/info.json" "$RUNTIME_REF" <<'RUBY'
            require "json"
            j = JSON.parse(File.read(ARGV[0]))
            die = ->(msg) { warn "::error::#{msg}"; exit 1 }
            pkg = j["package"] or die.call("no package block in info json")
            die.call("expected lean flag, got #{pkg["flags"].inspect}") unless pkg["flags"].include?("lean")
            die.call("launcher_abi != 1") unless pkg["launcher_abi"] == 1
            die.call("runtime_ref mismatch: #{pkg["runtime_ref"].inspect}") unless pkg["runtime_ref"] == ARGV[1]
            slots = j["slots"]
            die.call("expected 7 slots, got #{slots.length}") unless slots.length == 7
            # spec 30 + spec 32 layout: 0=app, 1=java exe (claimed, never
            # mounted), 2=java env image (claimed, never mounted),
            # 3=inkscape, 4=xml2rfc provider image (claimed, never
            # mounted), 5=python exe (claimed, never mounted), 6=python
            # env image (claimed, never mounted).
            # Slots 4/6 are limnifs, not dwarfs: the xml2rfc feedstock and
            # the python runtime factory build on the tebako 2.2.0
            # toolchain, whose mkimage default is limnifs (spec 20 §6).
            # Verified against the published bytes (xml2rfc 3.34.0,
            # tebako-runtime-python v0.1.0); the v2.2.0 runtime mounts
            # both backends.
            want = ["/__tfs__", "", "", "/opt/inkscape", "", "", ""]
            fmts = ["dwarfs", "auto", "dwarfs", "dwarfs", "limnifs", "auto", "limnifs"]
            slots.each_with_index do |s, i|
              die.call("slot#{i} mount #{s["mount"].inspect} != #{want[i].inspect}") unless s["mount"] == want[i]
              die.call("slot#{i} format #{s["format"].inspect} != #{fmts[i].inspect}") unless s["format"] == fmts[i]
            end
            puts "trailer gates OK (lean, abi=1, runtime_ref, 7 slots)"
          RUBY
          set +e
          "$TEBAKO_TOOLS/tebako-pkg" validate "$pkg" > "$RUNNER_TEMP/validate.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/validate.log"
          if [ "$rc" = 0 ]; then
            :
          elif [ "$rc" = 70 ]; then
            # spec 03 §7 fixed-point: an in-image manifest cannot carry its
            # own digest, so feedstocks embed zeros and validate reports
            # exactly five "manifest blob_sha256 00000000…" slot lines
            # (slots 0/2/3 — app, java image, inkscape — plus 4/6 — the
            # xml2rfc provider image and the python env image).
            # Anything else is a real structural failure. The trailing
            # "result: FAILED (exit 70)" summary line is excluded by the
            # em-dash anchor.
            fails=$(grep -c 'digest agreement: FAILED — manifest blob_sha256 00000000' "$RUNNER_TEMP/validate.log" || true)
            total=$(grep -c ': FAILED — ' "$RUNNER_TEMP/validate.log" || true)
            if [ "$fails" = 5 ] && [ "$total" = 5 ]; then
              echo "::notice::validate exit 70 with only the five known blob_sha256 fixed-point placeholders — accepted"
            else
              echo "::error::validate exit 70 with unexpected failures (placeholder lines: $fails, total FAILED: $total)"
              exit 1
            fi
          else
            echo "::error::tebako-pkg validate failed with exit $rc"
            exit 1
          fi

      - name: Structural gates (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TEBAKO_TOOLS=$(cygpath -u "$TEBAKO_TOOLS")
          RUNNER_TEMP=$(cygpath -u "$RUNNER_TEMP")
          pkg="dist/$LEGACY"
          MSYS2_ARG_CONV_EXCL='*' "$TEBAKO_TOOLS/tebako-pkg.exe" info --json "$pkg" > "$RUNNER_TEMP/info.json"
          ruby - "$RUNNER_TEMP/info.json" "$RUNTIME_REF" <<'RUBY'
            require "json"
            j = JSON.parse(File.read(ARGV[0]))
            die = ->(msg) { warn "::error::#{msg}"; exit 1 }
            pkg = j["package"] or die.call("no package block in info json")
            die.call("expected lean flag") unless pkg["flags"].include?("lean")
            die.call("launcher_abi != 1") unless pkg["launcher_abi"] == 1
            die.call("runtime_ref mismatch") unless pkg["runtime_ref"] == ARGV[1]
            # spec 30 layout: 0=app, 1=java exe (claimed, never mounted),
            # 2=java env image (claimed, never mounted), 3=inkscape.
            want = ["/__tfs__", "", "", "/opt/inkscape"]
            fmts = ["dwarfs", "auto", "dwarfs", "dwarfs"]
            die.call("expected 4 slots") unless j["slots"].length == 4
            j["slots"].each_with_index do |s, i|
              die.call("slot#{i} mount/format wrong") unless s["mount"] == want[i] && s["format"] == fmts[i]
            end
            puts "trailer gates OK"
          RUBY
          set +e
          MSYS2_ARG_CONV_EXCL='*' "$TEBAKO_TOOLS/tebako-pkg.exe" validate "$pkg" > "$RUNNER_TEMP/validate.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/validate.log"
          if [ "$rc" = 0 ]; then
            :
          elif [ "$rc" = 70 ]; then
            fails=$(grep -c 'digest agreement: FAILED — manifest blob_sha256 00000000' "$RUNNER_TEMP/validate.log" || true)
            total=$(grep -c ': FAILED — ' "$RUNNER_TEMP/validate.log" || true)
            if [ "$fails" = 3 ] && [ "$total" = 3 ]; then
              echo "::notice::validate exit 70 with only the three known blob_sha256 fixed-point placeholders — accepted"
            else
              echo "::error::validate exit 70 with unexpected failures"
              exit 1
            fi
          else
            echo "::error::tebako-pkg validate failed with exit $rc"
            exit 1
          fi

      - name: Smoke (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          "dist/$LEGACY" --version 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "Metanorma::Cli $PKG_VERSION" "$RUNNER_TEMP/smoke.log" || {
            echo "::error::smoke output does not contain 'Metanorma::Cli $PKG_VERSION'"
            exit 1
          }

      - name: argv0 dispatch smoke — fontist (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          # The L2 entries mirror the payload's complete declared inventory
          # (spec 03 §6 lockstep): a real copy under another declared name
          # argv0-dispatches THAT command (argv0 integrity — links/copies
          # only, never wrapper scripts).
          cp "dist/$LEGACY" "$RUNNER_TEMP/fontist"
          "$RUNNER_TEMP/fontist" --help 2>&1 | tee "$RUNNER_TEMP/smoke-fontist.log"
          grep -q "fontist " "$RUNNER_TEMP/smoke-fontist.log" || {
            echo "::error::argv0 fontist smoke did not print the fontist command list"
            exit 1
          }

      - name: Smoke (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          "./dist/$LEGACY" --version 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "Metanorma::Cli $PKG_VERSION" "$RUNNER_TEMP/smoke.log" || {
            echo "::error::smoke output does not contain 'Metanorma::Cli $PKG_VERSION'"
            exit 1
          }

      - name: argv0 dispatch smoke — fontist (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cp "dist/$LEGACY" "$RUNNER_TEMP/fontist.exe"
          "$RUNNER_TEMP/fontist.exe" --help 2>&1 | tee "$RUNNER_TEMP/smoke-fontist.log"
          grep -q "fontist " "$RUNNER_TEMP/smoke-fontist.log" || {
            echo "::error::argv0 fontist smoke did not print the fontist command list"
            exit 1
          }

      - name: Extract CA bundle from cached runtime image (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # tebako#437 workaround: mn2pdf's JVM needs a Windows-native CA file.
        # POSIX runtime images ship no ssl/cert.pem, hence Windows-only.
        # Runs after Smoke, so the runtime image is already in TEBAKO_HOME
        # — unless smoke hit the known windows runtime-resolution blocker,
        # in which case there is nothing to extract (compile fails the
        # same way and its verdict covers it).
        # Slash-less in-image path: msys2 would rewrite a leading slash.
        run: |
          set -euo pipefail
          TEBAKO_TOOLS=$(cygpath -u "$TEBAKO_TOOLS")
          home="$(cygpath -m "$TEBAKO_HOME")"
          img="$home/runtimes/ruby-${RUNTIME_RUBY}-${RUNTIME_TEBAKO}-windows-ucrt64/tebako-runtime-${RUNTIME_TEBAKO}-${RUNTIME_RUBY}-windows-ucrt64.tfs"
          pem="$(cygpath -u "$RUNNER_TEMP")/compile/cacert.pem"
          mkdir -p "$(dirname "$pem")"
          if [ -f "$img" ]; then
            MSYS2_ARG_CONV_EXCL='*' "$TEBAKO_TOOLS/tfs.exe" cat "$img" ssl/cert.pem > "$pem"
            echo "SSL_CERT_FILE=$(cygpath -w "$pem")" >> "$GITHUB_ENV"
          else
            echo "::notice::runtime image not cached (windows runtime-resolution blocker) — skipping CA extraction"
          fi

      - name: Compile xml+html (OIML — jing/schema validation)
        if: runner.os != 'Windows'
        timeout-minutes: 15
        # r060-1 proves the schema/argv-bridge stack on every leg. Fonts are
        # continued-past: the OIML theme declares Futura PT (commercial, no
        # public fontist formula); html/xml never resolve font locations.
        # The in-step timeout is a hard guard: a compile must NEVER hang
        # silently (the step-level timeout-minutes is the runner backstop).
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/compile"
          cd fixtures/r060-1
          set +e
          "$GITHUB_WORKSPACE/tools/with-timeout" 780 \
            "$GITHUB_WORKSPACE/dist/$LEGACY" compile -t oiml -x xml,html --agree-to-terms --continue-without-fonts document.adoc 2>&1 | tee "$RUNNER_TEMP/compile/compile-xml-html.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::compile TIMED OUT after 780s (rc=$rc) — last log lines:"
            tail -50 "$RUNNER_TEMP/compile/compile-xml-html.log" || true
            exit 1
          fi
          [ "$rc" -eq 0 ] || { echo "::error::compile exited $rc"; exit "$rc"; }
          test -s document.xml || { echo "::error::compile produced no document.xml"; exit 1; }
          test -s document.html || { echo "::error::compile produced no document.html"; exit 1; }

      - name: Compile PDF (ISO — the full font pipeline)
        if: runner.os != 'Windows'
        timeout-minutes: 30
        # The PDF acceptance runs the ISO flavour with font install ENABLED:
        # ISO's fonts (Cambria, Times New Roman, Source Han Sans, Inter…)
        # all resolve from public fontist formulas, so fontist downloads
        # them into the runner's ~/.fontist at compile time and mn2pdf/FOP
        # (on the openjdk payload) renders with real fonts.
        # First-run font downloads budget the longer timeout.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/compile"
          cd fixtures/iso-test
          set +e
          "$GITHUB_WORKSPACE/tools/with-timeout" 1500 \
            "$GITHUB_WORKSPACE/dist/$LEGACY" compile -t iso -x pdf --agree-to-terms document.adoc 2>&1 | tee "$RUNNER_TEMP/compile/compile-pdf.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::compile TIMED OUT after 1500s (rc=$rc) — last log lines:"
            tail -50 "$RUNNER_TEMP/compile/compile-pdf.log" || true
            exit 1
          fi
          [ "$rc" -eq 0 ] || { echo "::error::compile exited $rc"; exit "$rc"; }
          test -s document.pdf || { echo "::error::compile produced no document.pdf"; exit 1; }

      - name: Compile xml+html (OIML — jing/schema validation)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        timeout-minutes: 15
        # Same rationale as the POSIX leg: Futura PT is commercial; the
        # continue flag softens the install step (html/xml never resolve
        # font locations — that path is pdf-gated). The in-step timeout is
        # the hard guard against a silent hang.
        run: |
          mkdir -p "$RUNNER_TEMP/compile"
          cd fixtures/r060-1
          set +e
          "$GITHUB_WORKSPACE/tools/with-timeout" 780 \
            "$GITHUB_WORKSPACE/dist/$LEGACY" compile -t oiml -x xml,html --agree-to-terms --continue-without-fonts document.adoc 2>&1 | tee "$RUNNER_TEMP/compile/compile-xml-html.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::compile TIMED OUT after 780s (rc=$rc) — last log lines:"
            tail -50 "$RUNNER_TEMP/compile/compile-xml-html.log" || true
            exit 1
          fi
          [ "$rc" -eq 0 ] || { echo "::error::compile exited $rc"; exit "$rc"; }
          test -s document.xml || { echo "::error::compile produced no document.xml"; exit 1; }
          test -s document.html || { echo "::error::compile produced no document.html"; exit 1; }

      - name: Compile PDF (ISO — the full font pipeline)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        timeout-minutes: 30
        # Font install enabled: public-formula fonts download into the
        # runner's ~/.fontist at compile time; mn2pdf/FOP on the openjdk
        # payload renders with real fonts (the windows java bridge).
        run: |
          mkdir -p "$RUNNER_TEMP/compile"
          cd fixtures/iso-test
          set +e
          "$GITHUB_WORKSPACE/tools/with-timeout" 1500 \
            "$GITHUB_WORKSPACE/dist/$LEGACY" compile -t iso -x pdf --agree-to-terms document.adoc 2>&1 | tee "$RUNNER_TEMP/compile/compile-pdf.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::compile TIMED OUT after 1500s (rc=$rc) — last log lines:"
            tail -50 "$RUNNER_TEMP/compile/compile-pdf.log" || true
            exit 1
          fi
          [ "$rc" -eq 0 ] || { echo "::error::compile exited $rc"; exit "$rc"; }
          test -s document.pdf || { echo "::error::compile produced no document.pdf"; exit 1; }

      - name: Compile diagnostics on failure
        if: failure()
        shell: bash
        # Fires when any compile leg failed or timed out: the tee'd partial
        # logs and the surviving process tree are the evidence.
        run: |
          for f in "$RUNNER_TEMP"/compile/*.log "$RUNNER_TEMP"/smoke.log; do
            [ -f "$f" ] || continue
            echo "=== $f (tail 80) ==="
            tail -80 "$f" || true
          done
          echo "=== process tree ==="
          ps aux 2>/dev/null | grep -iE "java|jing|ruby|metanorma|tebako" | grep -v grep || true

      - name: Package artifacts (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p dist/final
          tar -C dist -czf "dist/final/$LEGACY.tgz" "$LEGACY"
          cd dist/final
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$LEGACY.tgz" | awk '{print $1}' > "$LEGACY.tgz.sha256.txt"
          else
            shasum -a 256 "$LEGACY.tgz" | awk '{print $1}' > "$LEGACY.tgz.sha256.txt"
          fi
          ls -l

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/final
          zip -j "dist/final/$LEGACY.zip" "dist/$LEGACY"
          cp "dist/$LEGACY" "dist/final/$LEGACY"
          cd dist/final
          sha256sum "$LEGACY"     | awk '{print $1}' > "$LEGACY.sha256.txt"
          sha256sum "$LEGACY.zip" | awk '{print $1}' > "$LEGACY.zip.sha256.txt"
          ls -l

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.triplet }}
          path: dist/final/
          retention-days: 14

  prepare:
    # Feedstock-bumped flow: fetch the new pins from the metanorma registry,
    # rewrite versions.yaml, commit to main, tag v<version>. Release then
    # fires from the tag push. Only runs on explicit dispatch, and ONLY
    # from the default branch — a workflow_dispatch on a side branch would
    # otherwise attempt `git push HEAD:main` plus a FORCE-PUSH of the
    # release tag pointing at branch commits (observed failing closed —
    # rejected push — on a feat/v2-assembly dispatch, run 34021017078).
    if: (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
      - name: Resolve target version
        id: prep
        run: |
          set -euo pipefail
          v='${{ github.event.client_payload.version }}'
          [ -n "$v" ] || v='${{ github.event.inputs.payload_version }}'
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::malformed version '$v'"; exit 1;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Fetch metanorma registry + sync pins
        run: |
          set -euo pipefail
          curl -fSL https://raw.githubusercontent.com/tebako-packages/metanorma/main/tpkg-registry.yaml \
            -o "$RUNNER_TEMP/metanorma-registry.yaml"
          ruby tools/sync-payload.rb "${{ steps.prep.outputs.version }}" "$RUNNER_TEMP/metanorma-registry.yaml"
      - name: Commit + tag
        run: |
          set -euo pipefail
          git config user.name tebako-ci
          git config user.email tebako@ribose.com
          git add versions.yaml
          if git diff --cached --quiet; then
            echo "::notice::versions.yaml already at ${{ steps.prep.outputs.version }} — nothing to commit"
          else
            git commit -m "chore: metanorma payload ${{ steps.prep.outputs.version }}"
            git push origin HEAD:main
          fi
          git tag -f "v${{ steps.prep.outputs.version }}"
          git push -f origin "v${{ steps.prep.outputs.version }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [press]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read release pins
        run: ruby tools/pins.rb --release >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: stage
      - name: Assemble release layout
        # POSIX-only while the windows press leg is parked (spec 32 — see
        # the press matrix comment): no dist-x86_64-windows-ucrt artifact
        # exists to copy.
        run: |
          set -euo pipefail
          mkdir -p rel
          cp stage/dist-aarch64-macos/metanorma-darwin-arm64.tgz* rel/
          cp stage/dist-x86_64-linux-gnu/metanorma-linux-x86_64.tgz* rel/
          ls -l rel
      - name: Release notes
        env:
          # The pkg installer section lists assets the installer-pkg legs
          # attach AFTER this release exists (they order after it), and
          # only on signing-armed runs — an unsigned installer container
          # never ships. The notes themselves therefore gate on the two
          # Apple gates the machinery requires together (spec 31 §5a: the
          # Installer cert beside the §5 notary plane).
          APPLE_INSTALLER_SIGNING_ENABLED: ${{ vars.APPLE_INSTALLER_SIGNING_ENABLED }}
          APPLE_SIGNING_ENABLED: ${{ vars.APPLE_SIGNING_ENABLED }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cat > RELEASE-NOTES.md <<EOF
          # metanorma $tag (tebako v2 assembly)

          Single-executable Metanorma assembled with the tebako v2 pipeline
          (fetch → assemble → validate → publish). Nothing compiles on your
          machine: the package carries the metanorma/OpenJDK/Inkscape payload
          slices plus the xml2rfc spawned payload with its python runtime
          (spec 32), and resolves the tebako Ruby runtime on first run.

          - metanorma payload: $PKG_VERSION (release $MN_RELEASE_NOTE)
          - OpenJDK slice: $JDK_RELEASE_NOTE · Inkscape slice: $INK_RELEASE_NOTE
          - xml2rfc slice (spawned payload, spec 32): $X2RFC_RELEASE_NOTE, dispatched on its bundled python runtime
          - runtime: tebako ruby $RUNTIME_RUBY_NOTE (runtime $RUNTIME_TEBAKO_NOTE), resolved via tebako toolchain v$TEBAKO_VERSION

          ## First run

          The package is LEAN: on first run it downloads the Ruby runtime pair
          (interpreter + env image, sha256-verified) into ~/.tebako and caches
          it machine-wide; later runs start immediately.

          ## Known limitations

          - NO WINDOWS PACKAGE in this release: the spec-32 xml2rfc spawn
            edge has no windows payload yet (the xml2rfc feedstock is
            POSIX-only and no windows python runtime exists), so the windows
            press leg is parked rather than silently dropping the edge.
            Windows re-arms with the feedstock's windows build; until then
            v1.16.9-3 remains the latest windows package.

          | Platform | Asset |
          |---|---|
          | macOS (Apple Silicon) | metanorma-darwin-arm64.tgz |
          | Linux (x86_64) | metanorma-linux-x86_64.tgz |
          EOF
          if [ "${APPLE_INSTALLER_SIGNING_ENABLED:-}" = "true" ] && [ "${APPLE_SIGNING_ENABLED:-}" = "true" ]; then
          cat >> RELEASE-NOTES.md <<EOF

          ## System installers (macOS)

          Signed + notarized pkg installers (spec 16 §7: the tebako tool
          set on PATH, the metanorma payload seeded into the machine-wide
          home and its runtime warmed at install time — first run needs no
          downloads). Built and install-rehearsed by the installer-pkg
          legs; they attach to this release shortly after it exists.

          | Platform | Asset |
          |---|---|
          | macOS installer (Apple Silicon) | metanorma-setup-$PKG_VERSION-macos-arm64.pkg |
          | macOS installer (Intel) | metanorma-setup-$PKG_VERSION-macos-x86_64.pkg |
          EOF
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE-NOTES.md
          files: |
            rel/metanorma-darwin-arm64.tgz
            rel/metanorma-darwin-arm64.tgz.sha256.txt
            rel/metanorma-linux-x86_64.tgz
            rel/metanorma-linux-x86_64.tgz.sha256.txt
      - name: Dispatch downstream
        # POSIX targets only while the windows leg is parked: chocolatey and
        # winget would fan out a release with no windows assets.
        env:
          GH_TOKEN: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
        run: |
          set -euo pipefail
          for target in metanorma/metanorma-snap metanorma/homebrew-metanorma; do
            gh api "repos/$target/dispatches" \
              -f event_type='${{ github.repository }}' \
              -f "client_payload[ref]=${GITHUB_REF_NAME}" \
              -X POST
          done


  # ---- the installer containers (spec 16 §7) -------------------------------
  # The product also ships as a system pkg (macOS; the MSI parks below) —
  # the CLIENT build of tamatebako/tebako's installer templates, fetched at
  # versions.yaml's installers.installer_ref (the SSOT; never forked).
  # Bound as a web bootstrapper: the installer stages the four PATH tools,
  # seeds the metanorma payload from the feedstock registry, and WARMS its
  # runtime at install time (the bundle home is root-owned; a user's
  # dispatch is read-only after the warm). Build + install rehearsal run on
  # every push/PR — the rehearsal IS the acceptance (registry registered,
  # payload + runtime cached); the containers attach to the tag release
  # only when the signing plane is armed (unsigned installer containers
  # never ship). The legs order AFTER release when it runs so the release
  # exists to receive the upload; release is skipped on non-tag runs and
  # the legs rehearse against the live registry.

  installer-pkg:
    name: installer (pkg, ${{ matrix.host_id }})
    needs: [release]
    if: ${{ always() && !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # The two macOS triplets. The Intel leg's seed installs metanorma
        # from the feedstock registry, so it turns green with the
        # feedstock's x86_64-macos payload (today the registry carries
        # aarch64-macos, x86_64-linux-gnu, x86_64-windows-ucrt).
        include:
          - { triplet: aarch64-macos, host_id: macos-arm64,  runner: macos-latest }
          - { triplet: x86_64-macos,  host_id: macos-x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Installer env (versions.yaml is the SSOT)
        run: ruby tools/pins.rb --installer-env "${{ matrix.triplet }}" >> "$GITHUB_ENV"

      - name: Fetch the pinned tebako tool set (sha256-verified)
        run: |
          set -euo pipefail
          mkdir -p staged frags
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 --output-dir staged "$base/SHA256SUMS"
          for tool in tebako tebako-shim tfs tebako-pkg; do
            case "$tool" in
              tebako) va=TEBAKO_ASSET; vs=TEBAKO_SHA256 ;;
              tebako-shim) va=SHIM_ASSET; vs=SHIM_SHA256 ;;
              tfs) va=TFS_ASSET; vs=TFS_SHA256 ;;
              tebako-pkg) va=PKG_ASSET; vs=PKG_SHA256 ;;
            esac
            asset="${!va}"; sha="${!vs}"
            curl -fsSLO --retry 5 --retry-all-errors --retry-delay 3 --output-dir staged "$base/$asset"
            echo "$sha  staged/$asset" | shasum -a 256 -c -
            got="$(grep "  $asset\$" staged/SHA256SUMS | cut -d' ' -f1 || true)"
            [ "$got" = "$sha" ] || { echo "::error::pin mismatch for $asset vs the release's SHA256SUMS: versions.yaml=$sha release=${got:-ABSENT}"; exit 1; }
            mv "staged/$asset" "staged/$tool-$PKG_VERSION-$HOST_ID"
            chmod +x "staged/$tool-$PKG_VERSION-$HOST_ID"
            echo "$sha" > "frags/$tool-$HOST_ID.sha256"
          done
          echo "staged + frag-anchored: tebako tebako-shim tfs tebako-pkg ($TEBAKO_RELEASE)"

      - name: Fetch the installer ci + templates at the pinned tebako ref
        uses: actions/checkout@v4
        with:
          repository: tamatebako/tebako
          ref: ${{ env.TEBAKO_INSTALLER_REF }}
          path: tebako-ci
          sparse-checkout: |
            ci
            templates

      # The spec 31 §5a gate: Developer ID **Installer** cert (a DIFFERENT
      # cert from the Application one). Disarmed (the default) builds +
      # rehearses unsigned; armed requires the org secrets (owner act).
      - name: Set up Apple installer signing (spec 31 §5a enablement gate)
        id: signgate
        working-directory: tebako-ci
        env:
          APPLE_INSTALLER_SIGNING_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.APPLE_INSTALLER_SIGNING_ENABLED }}
          APPLE_SIGNING_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.APPLE_SIGNING_ENABLED }}
          APPLE_DEVELOPER_ID_INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12 }}
          APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: bash ci/macos-sign-setup-installer.sh

      # Build → [armed] productsign + notarize + STAPLE → ship gates → the
      # install rehearsal (always; asserts the seed's effects — registry
      # registered, payloads cached, runtimes warmed). All in-script.
      - name: Build + sign + notarize + rehearse the pkg
        working-directory: tebako-ci
        env:
          VERSION: ${{ env.PKG_VERSION }}
          PLATFORM: ${{ env.HOST_ID }}
          SRC_DIR: ${{ github.workspace }}/staged
          FRAG_DIR: ${{ github.workspace }}/frags
          APPLE_INSTALLER_SIGNING_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || vars.APPLE_INSTALLER_SIGNING_ENABLED }}
          APPLE_ASC_KEY_P8: ${{ secrets.APPLE_ASC_KEY_P8 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: bash ci/macos-pkg-build.sh

      - name: Upload the pkg to the tag release (armed tags only)
        # No publish input here — the tag push IS the publish signal (the
        # release job's own condition); the arm gate keeps unsigned
        # containers off it.
        if: steps.signgate.outputs.armed == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${{ github.ref_name }}" "tebako-ci/out/${PRODUCT_NAME}-setup-${PKG_VERSION}-${HOST_ID}.pkg" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rehearsal evidence (unsigned container — CI inspection only)
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: installer-pkg-${{ matrix.host_id }}
          path: tebako-ci/out/
          retention-days: 7
          if-no-files-found: ignore

  # installer-msi PARKED (spec 32): the MSI leg unparks with the windows
  # press leg — versions.yaml's xml2rfc entry has no x86_64-windows-ucrt
  # asset (no windows xml2rfc payload from the POSIX-only feedstock, no
  # windows python runtime from the factory), so the windows product story
  # is incomplete and a windows installer container waits with it (see the
  # press matrix comment). The windows-signing environment on this repo is
  # ALREADY armed (Azure Trusted Signing: account metanorma-ci-signing,
  # profile metanorma-public-trust — owner-provisioned, do not recreate;
  # the Entra OIDC subject is the immutable repo-ID form, so the repo
