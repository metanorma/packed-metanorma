    # java runtime breaks every jing/mn2pdf-spawning compile.
    release: v2.4.0 # tebako-packages/openjdk tag
    lang_version: 21.0.12 # the engine version (lock.spawned[].version)
    tebako_version: 2.4.0 # the runtime's own tebako line (lock.spawned[].tebako)
