runtime:
  # The runtime reference every package entry carries:
  #   ruby@3.3.12;tebako=0.16.22;image
  # ruby stays on the 3.3 line ON PURPOSE: the benchmark comparison vs the
  # old (v1-tebako) packed-metanorma executables holds the interpreter line fixed
  # (owner decision 2026-08-26 — do NOT bump to 4.0.6 here).
  # 0.16.22 is REQUIRED by the spec-32 edge, not a preference: it is the
  # factory re-cut on the tebako v2.2.0 link unit (the schema_minor-5
  # driver parse) — on 0.16.21 the runtime exe's embedded driver refuses
  # the edge-carrying metanorma manifest at boot by name ("unknown
  # variant `executable`").
  release: v0.16.22 # tamatebako/tebako-runtime-ruby tag
  tebako: 0.16.22 # the runtime line (tebako=<abi> in the ref)
  ruby: 3.3.12 # the interpreter version
  sha256:
    exe:
      macos-arm64: 2a4bc5a9ad8860fa884586e9bcac87b14d7f5f41451a0e035ab8f0f77800f954
      linux-gnu-x86_64: 5a2b6c8303999af0b5c73d6125074de192af82cf86b58ca22567da7bcb010a72
