package:
  name: metanorma
  # The user-facing version = the metanorma payload version (the release
  # tag is v<this>). The composition's truth lives in the L2 package
  # manifest + the release's SHA256SUMS, not in an invented composite.
  version: 1.17.0

# The installer containers (spec 16 §7): the product also ships as a
# system pkg (macOS) and MSI (windows), built by tamatebako/tebako's ci
# scripts + templates, fetched at installer_ref (the SSOT — never
# forked). Bound as a WEB BOOTSTRAPPER:
# the installer stages the four PATH tools (the tebako/tebako-shim/tfs/
# tebako-pkg pins above), runs <root>/bootstrap-seed.* at install time
# (best-effort — an offline machine re-runs it later) to install the
# metanorma payload from the feedstock registry, WARMS its runtime into
# the root-owned machine home (a user's dispatch is read-only after the
# warm), and authors the <root>/home/shims store-grammar marker
# (spec 05 §3.1) so the bundle's tools resolve the bundle home
# zero-config.
installers:
  product_name: metanorma
  manufacturer: Metanorma
  org_id: org.metanorma
  install_root: /opt/metanorma # the pkg's root; the MSI roots at Program Files\metanorma
  # The seed installs the same-named payload from the FEEDSTOCK's registry
  # (payloads flow from tebako-packages/metanorma's published releases —
  # never from this repo's).
  registry: tfs:github:tebako-packages/metanorma
  # The installer machinery pin: a tamatebako/tebako sha (the
  # spec 16 §7 web-bootstrapper hook). fe67287 is main HEAD with
  # tebako#688 merged — the pkg rehearsal poll waits for the detached
  # seed's completion effects (the 1.17.0 leg exposed the race: the
  # rehearsal dispatch hit the root-held ruby install lock, EACCES).
  installer_ref: fe672875d41fe2972b89b84b5dd79b6933ad2bcc
  # The MSI UpgradeCode — LOCKED FOREVER (MSI upgrades pair on it). Minted
  # 2026-09-15 for this product line; never reuse tebako's own GUID. Only
  # the MSI leg consumes it.
  msi_upgrade_code: 57CE2E16-2EA0-4B1C-AD8F-7E66F82D0EAA

