runtime:
  # The runtime reference every package entry carries:
  #   ruby@4.0.7;tebako=0.17.1;image
  # ruby moves to the 4.0 line ON PURPOSE: metanorma 1.17.0's DEFAULT flavor
  # declares runtime_requirement ruby "~> 4.0.0" — the 3.3 line now serves
  # only the explicit 1.17.0-ruby3.3 fallback flavor (owner decision — the
  # 2026-08-26 "hold 3.3 for the v1 benchmark comparison" note is
  # superseded; 1.17 runs ruby 4.0 as default).
  # 0.17.1 is the current factory line (the shard era: per-(line ×
  # platform-group) release tags with per-row release refs — the registry's
  # rows carry the shard tags; the resolver rides them). The musl pairs
  # exist only on this line (the image-era shape) — the Alpine lane's
  # runtime side.
  release: v0.17.1 # tamatebako/tebako-runtime-ruby line (sharded tags below)
  tebako: 0.17.1 # the runtime line (tebako=<abi> in the ref)
  ruby: 4.0.7 # the interpreter version
