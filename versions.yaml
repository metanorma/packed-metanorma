    # openjdk is now a RUNTIME-kind payload: the v2.1.5 feedstock release
    # renamed the assets to the runtime grammar (tebako-runtime-<tools>-<ver>-*).
    # spec 30: it is NEVER co-mounted — the package carries the exe+image
    # pair as lock.spawned[]-claimed slots; the bootstrap stages them into
    # the machine runtime cache at dispatch and exports TEBAKO_SPAWN_LOCK.
    # v2.4.0 (REQUIRED 2026-09-06): the pair's launcher must read spec 32's
