runtime:
  # The runtime reference every package entry carries:
  #   ruby@4.0.9;tebako=0.17.16;image
  # ruby moves to the 4.0 line ON PURPOSE: metanorma 1.17.0's DEFAULT flavor
  # declares runtime_requirement ruby "~> 4.0.0" — the 3.3 line now serves
  # only the explicit 1.17.0-ruby3.3 fallback flavor (owner decision — the
  # 2026-08-26 "hold 3.3 for the v1 benchmark comparison" note is
  # superseded; 1.17 runs ruby 4.0 as default).
  # 0.17.16 is the current factory line: one release tag per version whose
  # per-platform registry rows carry the release ref (the resolver rides
  # them). The musl pairs exist only on this line (the image-era shape) —
  # the Alpine lane's runtime side. 0.17.16 is the v2.8.85 line's runtime
  # (tebako-runtime-ruby@84ca2149 pins the toolchain): it carries the
  # atomic exec-cache install (the mn2pdf java-child race, tebako#1112),
  # the macOS in-process file-IO arm (tebako#1126), the jail device
  # exemption (tebako#1128), the registry chase (tebako#1100), and the
  # spawn probe (tebako#1127) — the digests below mirror the line's
  # published .sha256 sidecars, cross-checked against the registry's
  # 4.0.9-0.17.16 rows.
  release: v0.17.16 # tamatebako/tebako-runtime-ruby line (the release tag the registry rows name)
  tebako: 0.17.16 # the runtime line (tebako=<abi> in the ref)
  ruby: 4.0.9 # the interpreter version
